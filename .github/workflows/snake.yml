name: Generate contribution snake

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        shell: bash
        run: |
          asset_dir="$(mktemp -d)"
          cp dist/github-snake.svg dist/github-snake-dark.svg "$asset_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin output:output; then
            git switch output
          else
            git switch --orphan output
          fi

          git rm -rf . || true
          cp "$asset_dir/github-snake.svg" "$asset_dir/github-snake-dark.svg" .
          git add github-snake.svg github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Contribution snake assets are already current."
            exit 0
          fi

          git commit -m "chore: update contribution snake"
          git push --set-upstream origin output
