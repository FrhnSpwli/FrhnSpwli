<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img">
  <title>Andi Farhan Sappewali's most used languages</title>
  <desc>Language distribution across recent public, non-fork repositories.</desc>
  <defs>
    <clipPath id="language-bar"><rect x="20" y="58" width="380" height="10" rx="5"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="419" height="189" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="20" y="30" fill="#f0f6fc" font-size="18" font-weight="600">Top Languages</text>
    <text x="20" y="48" fill="#8b949e" font-size="11">By code size in recent public projects</text>
    <g clip-path="url(#language-bar)">
      <rect x="20" y="58" width="380" height="10" fill="#21262d"/>
      <rect x="20.00" y="58" width="225.85" height="10" fill="#3178c6"/>
    <rect x="245.85" y="58" width="130.47" height="10" fill="#f1e05a"/>
    <rect x="376.32" y="58" width="12.11" height="10" fill="#3572a5"/>
    <rect x="388.43" y="58" width="7.98" height="10" fill="#d29922"/>
    <rect x="396.41" y="58" width="3.03" height="10" fill="#663399"/>
    <rect x="399.43" y="58" width="0.57" height="10" fill="#e34c26"/>
    </g>
    <circle cx="25" cy="90" r="5" fill="#3178c6"/>
    <text x="37" y="94" fill="#f0f6fc" font-size="12" font-weight="500">TypeScript</text>
    <text x="196" y="94" fill="#8b949e" font-size="11" text-anchor="end">59.4%</text>
    <circle cx="225" cy="90" r="5" fill="#f1e05a"/>
    <text x="237" y="94" fill="#f0f6fc" font-size="12" font-weight="500">JavaScript</text>
    <text x="396" y="94" fill="#8b949e" font-size="11" text-anchor="end">34.3%</text>
    <circle cx="25" cy="117" r="5" fill="#3572a5"/>
    <text x="37" y="121" fill="#f0f6fc" font-size="12" font-weight="500">Python</text>
    <text x="196" y="121" fill="#8b949e" font-size="11" text-anchor="end">3.2%</text>
    <circle cx="225" cy="117" r="5" fill="#d29922"/>
    <text x="237" y="121" fill="#f0f6fc" font-size="12" font-weight="500">PLpgSQL</text>
    <text x="396" y="121" fill="#8b949e" font-size="11" text-anchor="end">2.1%</text>
    <circle cx="25" cy="144" r="5" fill="#663399"/>
    <text x="37" y="148" fill="#f0f6fc" font-size="12" font-weight="500">CSS</text>
    <text x="196" y="148" fill="#8b949e" font-size="11" text-anchor="end">0.8%</text>
    <circle cx="225" cy="144" r="5" fill="#e34c26"/>
    <text x="237" y="148" fill="#f0f6fc" font-size="12" font-weight="500">HTML</text>
    <text x="396" y="148" fill="#8b949e" font-size="11" text-anchor="end">0.1%</text>
